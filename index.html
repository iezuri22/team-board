<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Apply Yourself</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="application-name" content="Apply Yourself">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column. Header with views, a plain summary line, filters, rows. Detail opens under its row. */
:root{
  --bg:#ffffff; --fg:#121417; --muted:#5f6670; --faint:#8d949e; --line:#e7e9ec; --soft:#f5f6f7; --soft2:#eceef1; --page:#fafafa; --card:#ffffff;
  --accent:#d9541a; --accent-wash:rgba(217,84,26,.08);
  --green:#1d7f55; --green-wash:rgba(29,127,85,.10); --blue:#2c64c9; --blue-wash:rgba(44,100,201,.09);
  --red:#b93a2b; --red-wash:rgba(185,58,43,.08); --amber:#a86a12; --amber-wash:rgba(168,106,18,.10);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1c1f24; --fg:#f2f4f6; --muted:#c3c8cf; --faint:#9ba2ac; --line:#3a3f47; --soft:#262a30; --soft2:#30353c; --page:#181b1f; --card:#23272d;
  --accent:#f2844a; --accent-wash:rgba(242,132,74,.16); --green:#55c995; --green-wash:rgba(85,201,149,.16); --blue:#8cb2ff; --blue-wash:rgba(140,178,255,.15);
  --red:#f28a7b; --red-wash:rgba(242,138,123,.15); --amber:#e8b45c; --amber-wash:rgba(232,180,92,.16); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-inline:28px;padding-block:0 72px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:22px 6px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:8px}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button{border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.views button:hover{color:var(--fg)}
.views button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.views .badge{font-size:12px;font-weight:600;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.spacer{flex:1}
.who-me{font-size:14px;color:var(--muted)}
.who-me b{color:var(--fg);font-weight:600}
.who-me button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 0 0 6px;font-size:13px}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--fg);color:var(--bg);white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}

.summary{padding-block:18px 20px;font-size:16px;color:var(--muted);display:flex;gap:6px 28px;flex-wrap:wrap}
.summary b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}
.summary .goal b{color:var(--accent)}

.panel{border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px;background:var(--bg)}
.panel h2{font-size:18px;margin-bottom:4px}
.panel .help{color:var(--muted);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:42px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:720px){.c4,.c3,.c2{grid-column:span 6}}
.warn{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;background:var(--amber-wash)}
.warn.stop{background:var(--red-wash)}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
.foot .msg{margin-right:auto;font-size:13.5px;color:var(--muted)}

.welcome{border:1px solid var(--line);border-radius:16px;padding:28px;margin:18px 0 28px;display:grid;gap:12px;max-width:560px}
.welcome h2{font-size:24px}
.welcome p{color:var(--muted)}
.welcome form{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.welcome input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:4px 12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px}
.filters input{margin-left:auto;width:240px;border-radius:10px}
@media (max-width:720px){.filters input{margin-left:0;width:100%}}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 160px 140px;gap:16px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}
.row .co{font-weight:600}
.row .ro{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta b{color:var(--fg);font-weight:500}
.flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr) 130px;gap:4px 12px}.row .meta.when{display:none}.row .st{grid-column:2;grid-row:1}}
.status{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:center}
.status:disabled{cursor:default}
.s-saved{background:var(--soft);color:var(--muted)}
.s-applied{background:var(--blue-wash);color:var(--blue)}
.s-heard{background:var(--amber-wash);color:var(--amber)}
.s-interview{background:var(--green-wash);color:var(--green)}
.s-offer{background:var(--green);color:#fff}
.s-rejected{background:var(--red-wash);color:var(--red)}
.s-skipped{background:var(--soft);color:var(--faint)}

.detail{padding:6px 6px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;cursor:default}
@media (max-width:760px){.detail{grid-template-columns:1fr;gap:18px}}
.facts{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:500}
.facts a{color:var(--accent);word-break:break-all}
.detail textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;margin-top:12px;min-height:64px}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.log h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.log ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;max-height:240px;overflow:auto}
.log li{font-size:13.5px;line-height:1.4}
.log li span{color:var(--faint);font-size:12.5px;display:block}

.empty{padding:44px 6px;color:var(--muted)}
.empty h3{font-size:19px;color:var(--fg);margin-bottom:6px}

.cards{display:grid;gap:0;border-top:1px solid var(--line)}
.reply{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;padding:16px 6px;border-bottom:1px solid var(--line);align-items:start}
.reply .when{font-weight:600;font-variant-numeric:tabular-nums}
.reply .when span{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.reply .what b{font-weight:600}
.reply .what p{color:var(--muted);font-size:14px;margin-top:2px}
@media (max-width:700px){.reply{grid-template-columns:1fr;gap:6px}}

.team-row{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(6,minmax(0,.5fr)) minmax(0,1.2fr);gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line)}
.team-row.head{font-size:13px;color:var(--muted);padding-block:10px}
.team-row .n{font-weight:650;font-size:18px;font-variant-numeric:tabular-nums}
.team-row .name{font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:30px}
.bars i{flex:1;background:var(--accent-wash);border-radius:2px 2px 0 0;min-height:2px}
.bars i.today{background:var(--accent)}
@media (max-width:760px){.team-row{grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,.5fr))}.team-row .hide{display:none}}

.brief{max-width:720px;padding-block:6px 30px}
.brief h2{font-size:22px;margin:30px 0 8px}
.brief h2:first-child{margin-top:6px}
.brief p{margin:8px 0;font-size:15.5px;line-height:1.65}
.brief ul{margin:6px 0;padding-left:20px;font-size:15.5px;line-height:1.65}
.brief blockquote{margin:12px 0;padding:12px 16px;background:var(--soft);border-radius:12px;font-size:15px}
.brief a{color:var(--accent)}
.brief table{border-collapse:collapse;font-size:15px;width:100%;margin:8px 0}
.brief td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.brief td:first-child{color:var(--muted);width:40%}
.brief-bar{display:flex;gap:10px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brief-bar .meta{font-size:13px;color:var(--faint);margin-right:auto}
.brief-edit textarea{width:100%;min-height:60vh;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;font-size:14px;line-height:1.6}
.table-x{overflow-x:auto}
.roster{display:grid;gap:0;border-top:1px solid var(--line)}
.roster-row{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.2fr) auto auto auto auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.roster-row.off{opacity:.5}
.roster-row input,.roster-add input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.tcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;letter-spacing:.08em}
.roster-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.roster-add input{flex:1;min-width:180px}
@media (max-width:760px){.roster-row{grid-template-columns:80px minmax(0,1fr);}.roster-row .btn{grid-column:auto}}
.nocontact{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-wash);border-radius:999px;padding:1px 8px;vertical-align:middle}
.block{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.block h3{font-size:15px;margin-bottom:8px}
.muted-line{color:var(--muted);font-size:14px}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.55;max-height:220px;overflow:auto;background:var(--soft);border-radius:10px;padding:12px 14px}
.desc-edit{min-height:180px}
.steps{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px}
.steps-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.steps-head h3{font-size:17px;letter-spacing:-.01em}.steps-head span{font-size:13px;color:var(--muted)}
.step-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:1100px){.step-list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.step-list>.step:first-child{grid-column:1/-1}}
@media (max-width:640px){.step-list{grid-template-columns:1fr}}
.step{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);transition:border-color .2s,box-shadow .2s}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.step.done{background:transparent}
.step-top{display:flex;align-items:center;gap:10px}.step-top b{font-size:15px}
.step.done .step-top b{color:var(--muted)}
.step-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft2);color:var(--muted)}
.step.cur .step-n{background:var(--accent);color:#fff}
.step.done .step-n{background:var(--green-wash);color:var(--green)}
.step-sub{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.step-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}.step-acts a.btn{text-decoration:none}
.res-chips{display:flex;flex-wrap:wrap;gap:6px}
.res-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.res-chip:hover{color:var(--fg)}.res-chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.res-preview{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.res-preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:18px;letter-spacing:-.015em;margin:0 0 8px}.modal p{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.55}
.modal-acts{display:flex;justify-content:flex-end;gap:8px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.nocredit{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-wash);border-radius:99px;padding:2px 8px;vertical-align:middle}
.fromif{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:2px 8px;vertical-align:middle}
.send-row{display:inline-flex;gap:6px;align-items:center}.send-sel{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:13px}
.doc-pick button.mine{border-style:dashed}.doc-pick button.mine.on{border-style:solid}
.doc-pick button.add{border:1px dashed var(--line);color:var(--accent);background:transparent}
.sug-btns{margin-left:auto;display:flex;gap:6px}.sug-acts{display:flex;gap:6px;align-items:flex-start}
.tb-color{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 8px}
.tb-color input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.tb-cbar{display:block;width:16px;height:3px;border-radius:2px;background:#1f4e79}
.tb-btn svg{display:block}
.tb-font{max-width:118px}.tb-size{max-width:66px}.tb-space{max-width:86px}.tb-style{max-width:120px}
.edit-pick{display:flex;justify-content:space-between;align-items:center;gap:12px 18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.edit-pick span{color:var(--muted);font-size:14px}.edit-pick b{font-size:14.5px}
.edit-pick-row{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end;min-width:260px}
.edit-pick-row select{flex:1;max-width:340px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px}
.textbox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}.textbox .acts{align-items:center}
.src-add{display:flex;gap:6px;align-items:center}.src-add input{flex:1;min-width:0}
.drop{display:grid;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;margin:4px 0 12px;background:var(--soft);transition:border-color .15s,background .15s}
.drop:focus-within,.drop.over{border-color:var(--accent)}
.drop.over{background:var(--card)}
.paste-box{width:100%;border:0;background:transparent;resize:none;font-size:15px;line-height:1.5;padding:4px 4px;min-height:52px;outline:none;overflow:hidden}
@media (max-width:640px){.paste-box{min-height:96px}}
.paste-box::placeholder{color:var(--muted)}
.drop-foot{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:0 4px}
.paste-msg{font-weight:600}.paste-msg.busy{color:var(--accent)}.paste-msg.ok{color:var(--green)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
.shots-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.shots-row:empty{display:none}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.shot-x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
.cv-edit{width:100%;min-height:300px;font-size:14px;line-height:1.55;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;resize:vertical}
.cv-edit.tall{min-height:440px}
.cv-show{max-height:none}
.cv-peek{white-space:pre-wrap;font-size:14px;line-height:1.55;color:var(--muted);max-height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent);margin:6px 0 4px}
.cv-changes{margin:8px 0 10px;padding-left:18px;font-size:13.5px;color:var(--muted)}
.cv-wrap{max-width:860px;margin:0 auto}
.doc-pick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.doc-pick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.doc-pick button:hover{color:var(--fg)}
.doc-pick button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.crow{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.crow:last-of-type{border-bottom:0}
.cmain b{font-weight:600}.cmain span{color:var(--muted)}
.clinks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.clinks a{color:var(--accent)}
.sel{user-select:all;color:var(--fg)}
.cmeta{font-size:12.5px;color:var(--faint)}
.cdraft summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.cdraft p{white-space:pre-wrap;font-size:14px;margin:8px 0}
.contact-form{display:grid;gap:8px;margin:10px 0}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.contact-form input,.contact-form textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
@media (max-width:600px){.cgrid{grid-template-columns:1fr}}

/* refresh 2026-10-14: friendlier, cleaner */
body{background:var(--page)}
.wrap{max-width:1120px}
.top{padding-block:20px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand{gap:0;font-weight:800;font-size:21px;letter-spacing:-.03em}.brand .o{width:.8em;height:.8em;margin:0 .03em;transform:translateY(.05em);flex:none}
.views{background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px}
.views button{padding:7px 14px}
.today-wrap{display:block;padding-block:14px 18px}
.today{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,300px);gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 28px;box-shadow:0 1px 2px rgba(18,20,23,.04),0 12px 30px -18px rgba(18,20,23,.18)}
.today.owner{grid-template-columns:minmax(0,1fr) minmax(0,300px);grid-template-areas:"head nudges" "rings nudges"}
.today.owner .today-head{grid-area:head}.today.owner .team-rings{grid-area:rings}.today.owner .nudges{grid-area:nudges}
@media (max-width:860px){.today,.today.owner{grid-template-columns:1fr;grid-template-areas:none}.today.owner>*{grid-area:auto!important}}
.today h2,.today-head h2{font-size:24px;letter-spacing:-.025em}
.today-head p,.today-line{color:var(--muted);margin-top:4px;font-size:16px}
.ringbox{position:relative;display:grid;place-items:center}
.ring .track{fill:none;stroke:var(--soft2);stroke-width:10}
.ring .fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}
.ring.done .fill{stroke:var(--green)}
.rcenter{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.rcenter b{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.rcenter span{font-size:13px;color:var(--muted)}
.rnum{position:absolute;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.chip.hot{background:var(--accent-wash);color:var(--accent)}.chip.hot b{color:var(--accent)}
.chip.cold{background:var(--soft);color:var(--muted)}.chip.cold b{color:var(--fg)}
.nudges{display:grid;gap:6px;align-content:start}
.nudges h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.nudge{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--fg);transition:transform .15s,border-color .15s}
.nudge:hover{border-color:var(--accent);transform:translateX(2px)}
.nudge b{color:var(--accent)}
.team-rings{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.mini{display:flex;align-items:center;gap:12px}
.mini b{display:block;font-weight:600}.mini span{font-size:13px;color:var(--muted)}
.rows{border-top:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{grid-template-columns:40px minmax(0,1fr) 190px 150px 140px;padding:12px 16px;transition:background .15s}
.row:last-child{border-bottom:0}
.co-av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;color:hsl(var(--h),55%,32%);background:hsl(var(--h),70%,93%)}
.ccount{color:var(--muted);font-weight:400}
.detail{padding:12px 16px 24px;background:var(--card)}
@media (max-width:760px){.row{grid-template-columns:36px minmax(0,1fr) 120px;gap:4px 12px}.row .meta{grid-column:2}.row .meta.when{display:none}.row .st{grid-column:3;grid-row:1}.detail{padding:8px 16px 20px}}
.filters{padding-block:10px 12px}
.panel{border-radius:18px;background:var(--card)}
.team-row .n.pts{color:var(--accent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){.ring .fill,.nudge{transition:none}}

.nocontact.fu{color:var(--blue);background:var(--blue-wash)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.inline-form input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.ed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:18px 16px}
.ed-head h2{font-size:24px;letter-spacing:-.025em}
.ed-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ed-body.solo{grid-template-columns:minmax(0,880px);justify-content:center}
@media (max-width:900px){.ed-body{grid-template-columns:1fr}}
.ed-left{display:grid;gap:10px}
.ed-text{width:100%;min-height:72vh;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);resize:vertical}
.ed-tips summary{cursor:pointer;color:var(--muted);font-size:14px}.ed-tips p{color:var(--muted);font-size:14px;margin-top:6px}
.paper-box{background:var(--soft2);border-radius:16px;padding:18px;position:sticky;top:12px}
.paper-scale{margin:0 auto;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -20px rgba(0,0,0,.35);background:#fff}
.paper-frame{width:816px;height:1056px;border:0;background:#fff;transform-origin:0 0;display:block}
.ed-col{display:grid;gap:10px}
.toolbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 8px 20px -14px rgba(0,0,0,.25)}
.tb-btn{border:0;background:transparent;color:var(--fg);border-radius:8px;padding:6px 9px;font-size:14px;cursor:pointer;min-width:32px}
.tb-btn:hover{background:var(--soft)}
.tb-btn.tb-warn{color:var(--muted);font-size:13px}
.tb-sel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13.5px}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.tb-grow{flex:1}
.ed-col .paper-box{position:static}
.btn.ai{background:linear-gradient(135deg,var(--accent),#c2410c);color:#fff;display:inline-flex;gap:6px;align-items:center}
.btn.ai:disabled{opacity:.7}
.spark{font-size:12px}
.fit{margin-top:12px;border-radius:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.fit-top{display:flex;gap:14px;align-items:center}
.fit-score{font-size:30px;font-weight:700;letter-spacing:-.03em;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.fit.good .fit-score{background:var(--green-wash);color:var(--green)}.fit.meh .fit-score{background:var(--amber-wash);color:var(--amber)}.fit.bad .fit-score{background:var(--red-wash);color:var(--red)}
.fit-verdict{font-weight:650}.fit-sum{color:var(--muted);font-size:14px}
.fit ul{margin:10px 0 6px;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.fit li{padding-left:18px;position:relative}.fit li.plus::before{content:"+";position:absolute;left:2px;color:var(--green);font-weight:700}.fit li.minus::before{content:"\2212";position:absolute;left:2px;color:var(--red);font-weight:700}
.sug:empty{display:none}
.sug{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.sug-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.sug-head h3{font-size:16px}.sug-head .btn{margin-left:auto}
.sug-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.sug-text{font-size:14.5px;line-height:1.5}
.sug-kw,.sug-note{font-size:14px;color:var(--muted)}.sug-kw b{color:var(--fg)}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.theme-btn:hover{color:var(--fg)}
.goal-lab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}.goal-in{width:64px}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:18px 14px}
.wk-head h2{font-size:24px;letter-spacing:-.025em}
.wk-tot{text-align:right;display:grid}.wk-tot b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.wk-tot span{font-size:13px;color:var(--muted)}
.wk-delta.up{color:var(--green)!important}.wk-delta.down{color:var(--red)!important}
.wk-card{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,300px);gap:24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:14px}
@media (max-width:960px){.wk-card{grid-template-columns:1fr}}
.wk-person{display:flex;gap:14px;align-items:center}.wk-person h3{font-size:19px}
.wk-mid{display:grid;gap:10px}
.wk-applied b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.wk-applied span{color:var(--muted);font-size:15px}
.wk-track{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}.wk-track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease}
.wk-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:4px}
.wk-stats b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:5px}.wk-stats span{font-size:13px;color:var(--muted)}
.wk-chart{position:relative;display:grid;gap:8px;height:120px;align-items:end;justify-content:end}
.wk-chart.empty-chart{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:14px;height:100px}.empty-chart p{color:var(--muted);font-size:13.5px;text-align:center;padding:0 12px}
.wk-goal em{position:absolute;left:0;top:-16px;font-size:10.5px;font-style:normal;color:var(--accent)}
.wk-col{display:grid;grid-template-rows:1fr 18px;height:100%;align-items:end;text-align:center}
.wk-bar{background:var(--soft2);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.wk-bar.hit{background:var(--green-wash)}.wk-bar.cur{background:var(--accent)}.wk-bar.cur.hit{background:var(--green)}
.wk-bar span{position:absolute;top:-17px;left:0;right:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-col small{font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:4px}
.wk-goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent);opacity:.6;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:50}
.note{background:var(--amber-wash);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
/* job detail, v2 */
.wrap{max-width:min(1760px,100%)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px 16px 22px;background:var(--card);border-bottom:1px solid var(--line)}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.d-main,.d-side{display:grid;gap:14px;align-content:start;min-width:0}
.detail .block{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.detail .block h3{margin:0}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.bhead h3{font-size:15px;letter-spacing:-.005em}
.bhead-acts{display:flex;gap:6px;flex-wrap:wrap}
.detail .desc{background:none;padding:0;border-radius:0;font-size:14px;line-height:1.6;max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.detail .desc.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.linkish.more{margin-top:8px;font-size:13.5px;font-weight:600;text-decoration:none}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.scard h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}.kv a{color:var(--accent);text-decoration:none}.kv a:hover{text-decoration:underline}
.scard textarea{width:100%;margin:0;min-height:76px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px;resize:vertical}
.scard .hint{display:block;font-size:12px;color:var(--faint);min-height:16px;margin-top:4px}
.side-acts{display:grid;gap:8px}.side-acts>.btn{width:100%}
.side-acts .send-row{display:flex;gap:6px}.side-acts .send-sel{flex:1;min-width:0}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.tl{list-style:none;margin:0;padding:0 0 0 14px;display:grid;gap:10px;border-left:2px solid var(--line)}
.tl li{position:relative;font-size:13.5px;line-height:1.4}
.tl li::before{content:"";position:absolute;left:-20px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tl li:first-child::before{border-color:var(--accent)}
.tl li span{display:block;color:var(--faint);font-size:12px;margin-top:1px}
.btn.ai.subtle{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.ai.subtle .spark{color:var(--accent)}
.detail .fit{margin:0 0 12px}
.detail .textbox{margin:0}
.steps{margin:0}
/* type-led pass: sections are type and space, not boxes */
.detail .block{background:none;border:0;border-radius:0;padding:0}
.d-main{gap:30px}
.bhead h3{font-size:17px;letter-spacing:-.015em}
.d-side{gap:24px;border-left:1px solid var(--line);padding-left:22px}
@media (max-width:900px){.d-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}}
.scard{background:none;border:0;border-radius:0;padding:0}
.steps{background:none;border:0;border-radius:0;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.steps-head h3{font-size:19px;letter-spacing:-.02em}
.step{background:var(--card)}
.step.done{background:transparent;border-style:dashed}
.detail{padding:18px 18px 26px}
/* main column + stacked sidebar; description fills the main column */
.detail .desc{max-height:220px;max-width:820px}
.detail .desc.open{columns:2 340px;column-gap:40px;max-height:none;max-width:none}
.detail .fit{max-width:760px}
.d-main>.block+.block{border-top:1px solid var(--line);padding-top:24px}
.detail .desc p{margin:0 0 14px;white-space:pre-wrap;break-inside:avoid-column}
.detail .desc .dh{font-weight:650;color:var(--fg)}
.detail .desc.short{columns:auto;max-width:820px}
.c-hist{list-style:none;margin:4px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);display:grid;gap:4px}
.c-hist li{font-size:13px;line-height:1.4}.c-hist li span{color:var(--faint);font-size:12px}
.crow{grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:16px}
.crow>.cmain{grid-column:1}.crow>.clinks{grid-column:2;grid-row:1;justify-content:flex-end}
.crow>*:not(.cmain):not(.clinks){grid-column:1/-1}
/* contacts tab */
.ct-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:18px 0 14px}
.ct-head h2{font-size:24px;letter-spacing:-.025em}
.ct-tools{display:flex;gap:8px;align-items:center}.ct-tools input{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-width:260px;font-size:14px}
.ct-list{border-top:1px solid var(--line)}
.ct-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.1fr);gap:6px 20px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.ct-row{grid-template-columns:1fr 1fr}}
.ct-who,.ct-job,.ct-meta{display:grid;gap:2px;min-width:0}.ct-who b{font-size:15px}.ct-who span,.ct-job span{font-size:13.5px;color:var(--muted)}
.ct-job .linkish{text-align:left;font-weight:600;text-decoration:none;color:var(--fg);font-size:14.5px}.ct-job .linkish:hover{color:var(--accent)}
.ct-links{display:flex;flex-direction:column;gap:2px;font-size:13.5px;min-width:0}.ct-links a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-meta span{font-size:12.5px;color:var(--faint)}.ct-meta .ct-last{color:var(--muted)}
/* every application list for teammates */
.scope{display:inline-flex;gap:4px;background:var(--soft2);border-radius:999px;padding:4px;margin:6px 0 10px}
.scope button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.scope button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.scope-n{font-size:12px;color:var(--faint);font-weight:600;margin-left:2px}
.blist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.blist .brow:first-child{border-top:0}.brow{padding-inline:14px}
.board-note{font-size:13.5px;color:var(--muted);padding:10px 4px 12px}
.brow{display:grid;grid-template-columns:36px minmax(0,1fr) 120px 110px 50px;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
@media (max-width:700px){.brow{grid-template-columns:36px minmax(0,1fr) 96px}.brow-when,.brow-mine{display:none}}
.brow-main{display:grid;min-width:0}.brow-main b{font-size:14.5px}.brow-main span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow-when{font-size:13px;color:var(--faint)}.brow-mine{font-size:12px;font-weight:600;color:var(--accent)}
.status-pill{justify-self:start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft2);color:var(--muted)}
.status-pill.s-applied{background:var(--blue-wash);color:var(--blue)}.status-pill.s-interview,.status-pill.s-offer{background:var(--green-wash);color:var(--green)}.status-pill.s-heard{background:var(--amber-wash);color:var(--amber)}
/* how we work */
#brief-bar{border:0;padding:0}
.hw-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:22px 0 18px;width:100%}
.hw-head h1{font-size:30px;letter-spacing:-.03em;margin:0}.hw-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
.hw-acts{display:flex;gap:8px}.hw-acts a.btn{text-decoration:none}
.hw-edit-acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px}.hw-edit-acts .muted-line{margin-right:auto}
.guide{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;outline:none}
.guide:focus-visible{border-color:var(--accent)}
@media (max-width:860px){.guide{grid-template-columns:1fr}.g-text{order:2}}
.g-text{display:grid;gap:10px;align-content:center}
.g-n{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.g-text h3{font-size:24px;letter-spacing:-.025em;line-height:1.2;margin:0}
.g-text p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6;min-height:75px}
.g-nav{display:flex;gap:8px;margin-top:6px}
.g-dots{display:flex;gap:6px;margin-top:4px}.g-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--soft2);cursor:pointer}.g-dots button.on{background:var(--accent);width:22px;border-radius:99px}
.g-shot{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--soft);aspect-ratio:16/10}
.g-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.hw-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;margin-top:40px}
@media (max-width:860px){.hw-body{grid-template-columns:1fr;gap:10px}.hw-toc{display:none}}
.hw-toc{position:sticky;top:20px;align-self:start;display:grid;gap:2px}
.hw-toc-t{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.hw-toc a{font-size:14px;color:var(--muted);text-decoration:none;padding:5px 0 5px 12px;border-left:2px solid var(--line)}.hw-toc a:hover{color:var(--fg);border-left-color:var(--accent)}
.brief{max-width:740px;padding:0}
.brief h2{font-size:21px;letter-spacing:-.02em;margin:40px 0 10px;scroll-margin-top:16px}
.brief h2:first-child{margin-top:0}
.brief p,.brief ul{font-size:15.5px;line-height:1.7}
.brief li{margin:3px 0}.brief li::marker{color:var(--faint)}
.brief strong,.brief b{font-weight:650}
.brief blockquote{margin:14px 0;padding:2px 0 2px 16px;background:none;border-left:3px solid var(--accent);border-radius:0;font-size:15.5px;font-weight:500}
.brief table{font-size:14.5px;margin:10px 0}.brief td{padding:9px 14px 9px 0}.brief td:first-child{width:36%;font-weight:500;color:var(--muted)}
.hw-upd{font-size:12.5px;color:var(--faint);margin:40px 0 0}
.ej{display:grid;gap:8px}.ej-f{display:grid;gap:3px}.ej-f span{font-size:12px;color:var(--muted)}
.ej-f input,.ej-f select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-size:14px;width:100%}
.ej-edit{margin-top:10px;font-size:13px;font-weight:600;text-decoration:none}
.c-out{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--green);font-weight:500;margin-top:2px}.c-out-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.ct-todo{font-size:12.5px;color:var(--amber)}.ct-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ct-acts .btn{padding:4px 10px;font-size:12px}
/* messages */
.mg-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-top:18px}.mg-wrap.solo{grid-template-columns:minmax(0,820px);justify-content:center}
@media (max-width:860px){.mg-wrap{grid-template-columns:1fr}}
.mg-rail{display:grid;gap:4px;align-content:start;position:sticky;top:16px}
.mg-rail-t{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 4px}
.mg-person{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--fg)}
.mg-person:hover{background:var(--soft)}.mg-person.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.mg-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:hsl(var(--h) 70% 92%);color:hsl(var(--h) 45% 32%)}
:root[data-theme="dark"] .mg-av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 70% 84%)}
.mg-pt{display:grid;min-width:0}.mg-pt b{font-size:14.5px}.mg-pt span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-count{min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.mg-dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.mg-main{display:grid;gap:14px;min-width:0}
.mg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.mg-head h2{font-size:24px;letter-spacing:-.025em}.mg-head p{margin:2px 0 0}
.mg-filter,.mg-seg{display:inline-flex;gap:3px;background:var(--soft2);border-radius:999px;padding:3px}
.mg-filter button,.mg-seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.mg-filter button.on,.mg-seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mg-tl{display:grid;gap:10px;max-height:58vh;overflow:auto;padding:4px 2px 8px}.mg-tl.compact{max-height:none}
.mg-day{justify-self:center;font-size:12px;font-weight:600;color:var(--faint);padding:8px 0 2px}
.mg-item{max-width:78%;justify-self:start;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 6px;padding:11px 14px;display:grid;gap:6px}
.mg-item.mine{justify-self:end;background:var(--soft);border-radius:16px 16px 6px 16px}
.mg-item.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.mg-tl.compact .mg-item{max-width:100%}
.mg-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint)}.mg-who{font-weight:600;color:var(--muted)}
.mg-kind{font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:99px;padding:2px 8px;background:var(--soft2);color:var(--muted)}
.mg-kind.k-question{background:var(--blue-wash);color:var(--blue)}.mg-kind.k-interview{background:var(--green-wash);color:var(--green)}.mg-kind.k-feedback{background:var(--amber-wash);color:var(--amber)}.mg-kind.k-reply{background:var(--accent-wash);color:var(--accent)}
.mg-body{margin:0;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.mg-job{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--fg)}
.mg-job .co-av{width:26px;height:26px;font-size:10.5px;border-radius:7px}.mg-job span span{display:block}.mg-job b{font-size:13px}.mg-job span span{font-size:12px;color:var(--muted)}
.mg-acts{display:flex;gap:6px;align-items:center}.mg-done{font-size:12.5px;color:var(--green);font-weight:600}
.mg-empty{display:grid;gap:4px;justify-items:center;text-align:center;padding:36px 12px;color:var(--muted);font-size:14px}.mg-empty b{color:var(--fg);font-size:15px}
.mg-compose{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.mg-crow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mg-crow select{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13.5px;max-width:340px;min-width:0;flex:1}
.mg-compose textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5;resize:vertical;min-height:76px}
.mg-quick{display:flex;gap:6px;flex-wrap:wrap}.mg-quick button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}.mg-quick button:hover{color:var(--fg);border-color:var(--accent)}
.mg-replying{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);background:var(--soft);border-left:3px solid var(--accent);border-radius:8px;padding:7px 10px}
.mg-send{display:flex;justify-content:space-between;align-items:center;gap:10px}
.roster-toggle{display:flex;justify-content:flex-end;padding-top:14px}
.msgchip{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-wash);border-radius:99px;padding:2px 8px;vertical-align:middle}
.mg-ev{display:flex;align-items:center;gap:8px;justify-self:center;max-width:92%;border:0;background:var(--green-wash);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;text-align:left}
.mg-ev .mg-time{color:var(--faint);font-size:12px;margin-left:4px}
.mg-subfilter{display:flex;gap:14px;margin-top:-6px}.mg-subfilter .linkish{text-decoration:none;color:var(--muted);font-size:13px;font-weight:600}.mg-subfilter .linkish.on{color:var(--accent)}
.mg-rail-t2{margin-top:16px}
.mg-av.all{background:var(--soft2);color:var(--fg)}
.ct-panel .ct-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.ct-panel .ct-tools input{flex:1;min-width:220px}
.ct-panel .btn.on{border-color:var(--accent);color:var(--accent)}
/* chat v2 */
.mg-wrap.solo{grid-template-columns:minmax(0,1040px)}
.mg-main{gap:12px}
.mg-chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;height:calc(100vh - 220px);min-height:520px;overflow:hidden}
.mg-chat .mg-subfilter{margin:0;padding:10px 18px;border-bottom:1px solid var(--line);gap:16px}
.mg-chat .mg-tl{flex:1;max-height:none;overflow-y:auto;padding:18px 20px 10px;gap:2px;align-content:start;display:flex;flex-direction:column}
.mg-chat .mg-tl>:first-child{margin-top:auto}
.mg-day{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;font-weight:600;margin:16px 0 10px;justify-self:stretch}
.mg-day::before,.mg-day::after{content:"";flex:1;height:1px;background:var(--line)}
.mg-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;max-width:100%}
.mg-row.cont{margin-top:3px}
.mg-row.mine{flex-direction:row-reverse}
.mg-av.sm{width:32px;height:32px;font-size:12px;flex:none}
.mg-row.cont .mg-av.sm{visibility:hidden;height:0}
.mg-col{display:flex;flex-direction:column;gap:4px;max-width:min(72%,640px);min-width:0}
.mg-row.mine .mg-col{align-items:flex-end}
.mg-meta{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--faint);padding:0 4px}.mg-meta b{color:var(--fg);font-size:13.5px;font-weight:650}
.mg-bubble{display:grid;gap:8px;background:var(--soft);border-radius:18px 18px 18px 6px;padding:10px 14px;min-width:0}
.mg-row.cont .mg-bubble{border-top-left-radius:6px}
.mg-row.mine .mg-bubble{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}
.mg-row.mine.cont .mg-bubble{border-top-right-radius:6px}
.mg-bubble.open{box-shadow:inset 0 0 0 1.5px var(--amber)}
.mg-row.mine .mg-bubble.open{box-shadow:0 0 0 2px var(--amber-wash)}
.mg-bubble .mg-kind{justify-self:start}
.mg-row.mine .mg-kind{background:rgba(255,255,255,.22);color:#fff}
.mg-body{font-size:14.5px;line-height:1.5;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.mg-row.mine .mg-job{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}.mg-row.mine .mg-job span span{color:rgba(255,255,255,.85)}
.mg-foot{display:flex;gap:12px;align-items:center;padding:0 4px;font-size:12.5px}
.mg-state{font-weight:600}.mg-state.pending{color:var(--amber)}.mg-state.pending::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:1px}.mg-state.done{color:var(--green)}
.mg-link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer}.mg-link:hover{text-decoration:underline}
.mg-link.strong{background:var(--accent);color:#fff;padding:5px 12px;border-radius:14px}.mg-link.strong:hover{text-decoration:none;filter:brightness(.95)}
.mg-ev{margin:14px 0 4px;align-self:center}
.mg-chat .mg-compose{border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 16px 10px;gap:8px;background:var(--card)}
.mg-inputrow{display:flex;gap:10px;align-items:flex-end}
.mg-inputrow textarea{flex:1;min-height:44px;max-height:180px;border-radius:14px;padding:11px 14px}
.mg-sendbtn{height:44px;padding:0 20px}
.mg-hint{font-size:11.5px;color:var(--faint)}
.mg-crow select{max-width:300px}
.mg-empty{margin:auto}
.ct-acts-row{grid-column:1/-1;margin-top:2px}.ct-acts-row .ct-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.dr-inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.dr-state{font-size:12.5px;color:var(--muted);font-weight:600}.dr-state.due{color:var(--amber)}.dr-state.ok{color:var(--green)}
.dr-panel{display:grid;gap:8px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;margin:8px 0 12px}
.dr-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.dr-top b{font-size:14.5px}.dr-top span{font-size:12.5px;color:var(--muted)}
.dr-panel textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.5;resize:vertical;margin:0}
.dr-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.dr-acts a.btn{text-decoration:none}.dr-close{margin-left:auto;font-size:13px;text-decoration:none;color:var(--muted)}
/* answering a teammate's questions one at a time */
.qa-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.45);display:grid;place-items:center;padding:16px}
.qa{background:var(--card);color:var(--fg);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.qa-top{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 14px;border-bottom:1px solid var(--line)}
.qa-top h3{margin:0;font-size:20px;letter-spacing:-.01em}
.qa-top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.qa-x{margin-left:auto;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted);flex:none}
.qa-steps{display:flex;flex-wrap:wrap;gap:6px;padding:12px 26px 0}
.qa-steps button{min-width:30px;height:30px;padding:0 8px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px;line-height:1;font-family:inherit;cursor:pointer}
.qa-steps button.done{background:#e8f5ec;border-color:#bfe3c9;color:#1e7a3c}
.qa-steps button.on{background:var(--fg);border-color:var(--fg);color:var(--card)}
.qa-body{padding:20px 26px 8px;overflow:auto;flex:1}
.qa-num{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.qa-req{margin-left:8px;color:#c2410c}
.qa-q{font-size:20px;line-height:1.45;font-weight:600;margin:6px 0 18px}
.qa-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.qa-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-size:15.5px;cursor:pointer}
.qa-opt:hover{background:var(--soft)}
.qa-opt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none}
.qa-opt.multi i{border-radius:5px}
.qa-opt.on{border-color:#d9541a;background:#fff4ee}
.qa-opt.on i{border-color:#d9541a;background:#d9541a;box-shadow:inset 0 0 0 3px #fff4ee}
.qa-body textarea{width:100%;box-sizing:border-box;min-height:96px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15.5px;line-height:1.5;background:var(--card);color:var(--fg);resize:vertical}
.qa-sug{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.qa-note{font-size:13.5px;color:var(--muted)}
.qa-foot{display:flex;align-items:center;gap:10px;padding:14px 26px 20px;border-top:1px solid var(--line)}
.qa-foot .sp{flex:1}.qa-saved{font-size:13px;color:#1e7a3c;font-weight:600}
.qa-rev{display:flex;flex-direction:column;gap:14px}
.qa-rev div{border-bottom:1px solid var(--line);padding-bottom:12px}
.qa-rev b{display:block;font-size:14.5px;margin-bottom:4px}
.qa-rev span{white-space:pre-wrap;font-size:15px}
.qa-rev span.none{color:var(--faint);font-style:italic}
.qa-load{padding:40px 26px;color:var(--muted);font-size:15px}

/* people, grouped by company, three per company */
.ct-group{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t g" "a a";gap:6px 16px;align-items:center;padding:22px 4px 10px;border-bottom:1px solid var(--line)}
.ct-gtitle{grid-area:t;display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.ct-co{border:0;background:none;padding:0;font-weight:700;font-size:17px;line-height:1.2;font-family:inherit;color:var(--fg);cursor:pointer}.ct-co:hover{text-decoration:underline}
.ct-roles{font-size:13.5px;color:var(--muted)}
.ct-goal{grid-area:g;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px;background:#fff1e8;color:#b4471a}
.ct-goal.full{background:#e8f5ec;color:#1e7a3c}
.ct-gacts{grid-area:a;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ct-li{font-size:13px;color:var(--muted);display:inline-flex;gap:10px;flex-wrap:wrap}.ct-li a{color:var(--accent)}
.ct-find{padding:8px 4px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ct-find-note{margin:0;font-size:13.5px;color:var(--muted)}
.ct-sug{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto auto;gap:6px 18px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
.ct-why{font-size:13.5px;color:var(--muted)}.ct-loc{font-size:12.5px;color:var(--faint)}
.ct-sug-acts{display:flex;gap:6px}
@media (max-width:900px){.ct-sug{grid-template-columns:1fr 1fr}}

/* People as a grid: company parent rows, people under them (Smartsheet / War Room feel) */
.pg-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 250px);background:var(--card)}
.pg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:860px}
.pg-table thead th{position:sticky;top:0;z-index:2;background:#1e3a8a;color:#fff;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:9px 10px;white-space:nowrap}
.pg-table td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.pg-table td.pg-n,.pg-table th.pg-n{width:30px;text-align:center;color:var(--faint);font-size:11.5px;padding-left:6px;padding-right:4px;border-right:1px solid var(--line)}
.pg-table thead th.pg-n{border-right-color:rgba(255,255,255,.18)}
.pg-row:hover td{background:var(--soft)}
.pg-row.open td{background:#fff6ef}
.pg-name{white-space:nowrap}.pg-name b{font-weight:600;font-size:13.5px}
.pg-in{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:4px;background:#0a66c2;color:#fff!important;font:700 10.5px/1 -apple-system,Arial,sans-serif;text-decoration:none;vertical-align:1px}
.pg-in.mail{background:var(--soft2);color:var(--fg)!important}
.pg-title,.pg-role{color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-found{color:var(--faint);white-space:nowrap;font-size:12px}.pg-found .spark{color:#d9541a}
.pg-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--soft2);color:var(--muted);white-space:nowrap}
.pg-pill.sent{background:#e7efff;color:#1d4ed8}.pg-pill.ok{background:#e8f5ec;color:#1e7a3c}
.pg-dim{color:var(--faint);font-size:12px;white-space:nowrap}.pg-ready{color:#b4471a;font-weight:600;font-size:12px;white-space:nowrap}.pg-due{color:#c2410c;font-weight:600;font-size:12px;white-space:nowrap}
.pg-acts{white-space:nowrap;text-align:right}
.pg-act{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;margin-left:4px}
.pg-act:hover{background:var(--soft)}.pg-act.ai .spark{color:#d9541a}.pg-act.on{background:#fff1e8;border-color:#f3c3a6}
.pg-act.add{background:#d9541a;border-color:#d9541a;color:#fff}
.pg-grp td{background:var(--soft);border-bottom:1px solid var(--line);padding-top:9px;padding-bottom:9px}
.pg-grp:not(:first-child) td{border-top:2px solid var(--line)}
.pg-co{border:0;background:none;padding:0;font-weight:700;font-size:14.5px;font-family:inherit;color:var(--fg);cursor:pointer;margin-right:10px}.pg-co:hover{text-decoration:underline}
.pg-roles{color:var(--muted);font-size:12.5px}
.pg-caret{border:0;background:none;color:inherit;cursor:pointer;font-size:12px;padding:2px;transition:transform .15s}.pg-caret.shut{transform:rotate(-90deg)}
