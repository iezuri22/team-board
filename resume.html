<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply Yourself Resume</title>
<link rel="icon" href="favicon.svg">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#121417;--muted:#5f6670;--faint:#8d949e;--line:#e5e7eb;--soft:#eef0f3;--accent:#d9541a;--accent-wash:rgba(217,84,26,.08);--green:#1d7f55;--green-wash:rgba(29,127,85,.1);--red:#c2362b;--red-wash:rgba(194,54,43,.08);--amber:#a86207}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
@media (max-width:640px){html,body{font-size:16px}}
.wrap{max-width:1080px;margin:0 auto;padding:22px clamp(16px,4vw,64px) 80px}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:26px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center}
.brand img{width:19px;height:19px;margin:0 1px;transform:translateY(1px)}
.brand small{font-weight:600;font-size:13px;color:var(--accent);margin-left:8px;letter-spacing:.02em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg)}.tab.on{background:var(--fg);color:#fff}
.sp{flex:1}
.who{font-size:14px;color:var(--muted)}.who b{color:var(--fg)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
h1{font-size:34px;line-height:1.15;letter-spacing:-.025em;margin:0 0 6px}
h2{font-size:23px;letter-spacing:-.02em;margin:34px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .hsub{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0}
@media (max-width:640px){h2 .hsub{display:none}}
h3{font-size:18px;margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 18px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#cfd3d9}.btn:disabled{opacity:.55;cursor:default}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}.btn.go:hover{filter:brightness(1.05)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
textarea.in{min-height:120px;line-height:1.5;resize:vertical}
textarea.mono{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
@media (max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.err{color:var(--red);font-size:15px;min-height:20px;margin:10px 0 0}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase}
.pill.apply{background:var(--green-wash);color:var(--green)}.pill.maybe{background:rgba(168,98,7,.1);color:var(--amber)}.pill.skip{background:var(--red-wash);color:var(--red)}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:rgba(0,0,0,.015)}
.item b{display:block;font-size:16.5px}.item span.s{font-size:14px;color:var(--muted)}
.item .num{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 2px}
.big .n{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big .of{font-size:15px;color:var(--muted)}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 0;font-size:15px;color:var(--muted)}.facts b{color:var(--fg)}
.gates{margin:8px 0 0;padding:0;list-style:none}
.gates li{display:grid;grid-template-columns:22px 170px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15.5px}
@media (max-width:640px){.gates li{grid-template-columns:22px 1fr}.gates li .why{grid-column:2}}
.gates .ok{color:var(--green);font-weight:800}.gates .no{color:var(--red);font-weight:800}.gates .why{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip.miss{background:var(--red-wash);color:var(--red)}.chip.add{background:var(--green-wash);color:var(--green)}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.paper iframe{display:block;width:816px;border:0;transform-origin:0 0}
.paper .holder{overflow:hidden}
.note{font-size:14.5px;color:var(--muted);margin:10px 0 0}
details{margin:12px 0 0}details summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--muted)}
.check{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;cursor:pointer}
.step .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;font-size:12px;color:#fff}
.step.done .d{background:var(--green);border-color:var(--green)}.step.done{color:var(--muted)}
.welcome{max-width:520px;margin:9vh auto 0}
.welcome h1{font-size:40px}
.split{display:grid;gap:30px;margin-top:26px}
.chat{display:flex;flex-direction:column;gap:14px;margin:6px 0 16px}
.msg{max-width:780px;padding:12px 15px;border-radius:14px;font-size:16px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--fg);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.prop{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14.5px;white-space:normal}
.prop h4{margin:10px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.prop .was{color:var(--red);text-decoration:line-through}.prop .now{color:var(--green)}
.prop pre{white-space:pre-wrap;font:13.5px/1.5 ui-monospace,Menlo,monospace;background:var(--soft);border-radius:8px;padding:8px 10px;margin:4px 0}
.composer{display:flex;gap:10px;align-items:flex-end}.composer textarea{min-height:52px;height:52px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw}
.codebox{font:700 26px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:14px 18px;border-radius:12px;background:var(--card);border:1px dashed var(--accent);display:inline-block;margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}table.t th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}table.t td{padding:8px;border-bottom:1px solid var(--line)}
.back{display:inline-block;margin:0 0 10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}.back:hover{color:var(--fg)}
.status{border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:14px;background:var(--card)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bell{position:relative;border:1px solid var(--line);background:var(--card);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.npanel{position:absolute;right:clamp(16px,4vw,64px);top:74px;width:min(420px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.14);z-index:40;padding:6px 0}
.npanel .nh{display:flex;justify-content:space-between;align-items:center;padding:8px 16px}.nrow{padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;font-size:15px}.nrow.new{background:var(--accent-wash)}.nrow .s{color:var(--muted);font-size:14px;white-space:pre-wrap}
.wrap{position:relative}
.faint{color:var(--faint)}.s{font-size:14px;color:var(--muted)}
.banner{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 18px;margin:0 0 22px;font-size:16px;white-space:pre-wrap}
.banner.bad{border-left-color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0 4px;font-size:15.5px}
.pc{border-bottom:1px solid var(--line);padding:12px 2px}.pc:first-of-type{border-top:1px solid var(--line)}.pc.done .pc-who b{color:var(--muted)}
.pc-h{display:grid;grid-template-columns:1fr auto 32px;gap:12px;align-items:center;cursor:pointer}
.pc-who b{font-size:16.5px}.in-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:#0a66c2;color:#fff;font:700 12px/1 -apple-system,sans-serif;text-decoration:none;margin-left:7px;vertical-align:2px}
.pc-st{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pc-st.good{background:var(--green-wash);color:var(--green)}.pc-st.bad{background:var(--red-wash);color:var(--red)}.pc-st.warn{background:rgba(168,98,7,.1);color:var(--amber)}.pc-st.info{background:rgba(31,78,121,.08);color:#1f4e79}
@media (max-width:640px){.pc-h{grid-template-columns:1fr 32px}.pc-h .pc-st{grid-column:1;grid-row:2;justify-self:start}}
.x{border:0;background:none;color:var(--faint);font-size:22px;line-height:1;width:30px;height:30px;border-radius:8px;cursor:pointer}.x:hover{background:var(--red-wash);color:var(--red)}
.pc-more{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14.5px}.pc-more .linkish{color:var(--muted);font-weight:500}.pc-more .linkish:hover{color:var(--fg)}
.subtabs{display:flex;gap:4px;margin:12px 0 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.subtabs .st{border:0;background:none;padding:8px 12px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs .st.on{color:var(--fg);border-bottom-color:var(--fg)}.subtabs.big .st{font-size:16px;padding:10px 14px}.subtabs .ct{font-size:13px;background:var(--soft);border-radius:999px;padding:1px 8px;margin-left:2px}
@media (max-width:640px){.subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.subtabs .st{white-space:nowrap;flex:none}}
.addp{margin:10px 0 6px}
.rrow,.mrow{display:flex;gap:14px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.rwho,.mbody{flex:1;min-width:0;cursor:pointer}.rwho b,.mbody b{font-size:16px}.mbody .s{overflow:hidden;text-overflow:ellipsis}
.racts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.mrow.done{opacity:.55}.mrow .pc-st{min-width:84px;text-align:center}
@media (max-width:640px){.rrow,.mrow{flex-wrap:wrap}.racts{width:100%;justify-content:flex-start}}
a.btn{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var API="https://team-board-api.iezuri22.workers.dev",PAGE=location.origin+location.pathname;
var S={tab:"jobs",open:null,chat:[],pcOpen:{},pcTab:{}};
function $(id){return document.getElementById(id)}
function el(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else e.setAttribute(k,v===true?"":v)}
  [].concat(kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var x=el("div",{class:"toast",text:t});document.body.appendChild(x);setTimeout(function(){x.remove()},3200)}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function api(method,path,body,tok){var t=tok===undefined?read("ay-r-token"):tok;
  return fetch(API+path,{method:method,headers:Object.assign({"Content-Type":"application/json"},t?{Authorization:"Bearer "+t}:{}),body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok){if(r.status===401&&d.error==="signed_out"&&tok===undefined){store("ay-r-token",null);S.data=null;render()}var e=new Error(d.error||"failed");e.msg=d.error;throw e}return d})})}
function fail(e){toast(e&&e.msg&&e.msg!=="failed"?e.msg:"That didn't work. Check your connection and try again.")}
function busy(btn,label){var old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+esc(label);return function(){btn.disabled=false;btn.innerHTML=old}}
function load(){return api("GET","/api/r/me").then(function(d){S.data=d;render()},function(e){if(!read("ay-r-token"))render();else fail(e)})}

// ---------- resume rendering and PDF (the same layout the team board prints) ----------
var RESUME_CSS="@page{size:Letter;margin:0}*{box-sizing:border-box}body{margin:0;color:#16181d;background:#fff;font:10pt/1.42 'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}h1{margin:0;font-size:21pt;font-weight:700;letter-spacing:.035em;text-transform:uppercase}.contact{margin:3pt 0 0;font-size:8.9pt;color:#4a4d55}.tagline{margin:6pt 0 0;font-size:9.6pt;font-weight:600;color:#1f4e79;line-height:1.35}h2{margin:13pt 0 5pt;font-size:9pt;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1f4e79;border-bottom:.8pt solid #c9ced6;padding-bottom:2.5pt}.org{margin:2pt 0 0;font-size:10pt;font-weight:700}.org-note{font-size:9pt;font-style:italic;color:#5a5d64}.role{display:flex;justify-content:space-between;align-items:baseline;gap:10pt;margin:6pt 0 2pt}.role .t{font-size:10pt;font-weight:700}.role .sub{font-weight:400;color:#4a4d55;margin-left:5pt}.role .d{font-size:8.9pt;color:#4a4d55;white-space:nowrap}.stack{margin:1pt 0 3pt;font-size:8.7pt;font-style:italic;color:#1f4e79}p{margin:0 0 4pt}ul{margin:2pt 0 0;padding-left:13pt}li{margin-bottom:2.6pt;padding-left:1pt;break-inside:avoid}.sk{margin:0 0 3.2pt;font-size:9.4pt;line-height:1.4}.sk b{font-weight:600;color:#1f4e79}h2,.role{break-after:avoid}a{color:inherit;text-decoration:none}";
function rInline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*]+?)\*(?!\w)/g,"$1<i>$2</i>")}
function resumeHTML(md){var L=String(md||"").split(/\r?\n/),out=[],i=0,tag=false,sk=false,ul=[];
  function flush(){if(ul.length){out.push("<ul>"+ul.map(function(x){return"<li>"+rInline(x)+"</li>"}).join("")+"</ul>");ul=[]}}
  while(i<L.length){var t=L[i].trim();i++;
    if(/^[-*] /.test(t)){ul.push(t.slice(2));continue}flush();if(!t||/^-{3,}$/.test(t))continue;
    if(/^# /.test(t)){out.push("<h1>"+rInline(t.slice(2))+"</h1>");while(i<L.length&&!L[i].trim())i++;if(i<L.length&&!/^#|^\*\*/.test(L[i].trim())){out.push('<p class="contact">'+rInline(L[i].trim())+"</p>");i++}continue}
    if(/^## /.test(t)){sk=/SKILL/i.test(t);out.push("<h2>"+rInline(t.slice(3))+"</h2>");continue}
    if(/^### /.test(t)){out.push('<p class="org">'+rInline(t.slice(4))+"</p>");continue}
    var m=t.match(/^\*\*(.+?)\*\*\s*[—-]\s*(.*?)\s*(?:\(([^)]*)\))?\s*$/);
    if(m&&!sk){out.push('<div class="role"><span class="t">'+rInline(m[1])+(m[2]?' <span class="sub">'+rInline(m[2])+"</span>":"")+'</span><span class="d">'+esc(m[3]||"")+"</span></div>");continue}
    if(!tag&&/^\*\*[^*].*\*\*$/.test(t)){tag=true;out.push('<p class="tagline">'+rInline(t.slice(2,-2))+"</p>");continue}
    if(/^\*[^*].*\*$/.test(t)){out.push('<p class="org-note">'+rInline(t.slice(1,-1))+"</p>");continue}
    out.push(sk?'<p class="sk">'+rInline(t)+"</p>":"<p>"+rInline(t)+"</p>")}
  flush();return out.join("\n")}
function shell(css,inner,title,tb,lr){return "<!doctype html><html><head><meta charset='utf-8'><title>"+esc(title)+"</title><style>"+css+"html,body{margin:0}body{padding:0 "+lr+"}.pg{width:100%;border-collapse:collapse}.pg td{padding:0;vertical-align:top}.pg thead td,.pg tfoot td{height:"+tb+"}</style></head><body><table class='pg'><thead><tr><td></td></tr></thead><tfoot><tr><td></td></tr></tfoot><tbody><tr><td>"+inner+"</td></tr></tbody></table></body></html>"}
function printHTML(html){var f=el("iframe",{style:"position:fixed;right:0;bottom:0;width:0;height:0;border:0"});document.body.appendChild(f);var d=f.contentDocument;d.open();d.write(html);d.close();setTimeout(function(){try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast("Couldn't open the print dialog")}setTimeout(function(){f.remove()},60000)},350)}
function fileName(kind,co){var n=((S.data.settings.profile||{}).name||S.data.ws.name||"Resume").replace(/[^A-Za-z0-9]+/g,"_");return n+"_"+kind+(co?"_"+String(co).replace(/[^A-Za-z0-9]+/g,"_"):"")}
function printResume(md,co){printHTML(shell(RESUME_CSS,resumeHTML(md),fileName("Resume",co),"0.5in","0.62in"))}
var COVER_CSS="@page{size:Letter;margin:0}*{box-sizing:border-box}body{color:#16181d;background:#fff;font:10.6pt/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-ligatures:none}.lh{display:flex;align-items:center;gap:14pt;padding-bottom:14pt;border-bottom:2pt solid #1f4e79;margin-bottom:22pt}.mono{flex:none;width:40pt;height:40pt;border-radius:7pt;background:#1f4e79;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15pt}.nm{margin:0;font-size:21pt;font-weight:700;letter-spacing:.035em;text-transform:uppercase;line-height:1.1}.tg{margin:3pt 0 0;font-size:9.6pt;font-weight:600;color:#1f4e79}.ct{margin:3pt 0 0;font-size:8.9pt;color:#4a4d55}.dt{margin:0 0 16pt;color:#4a4d55}.lb p{margin:0 0 10pt}";
function coverInner(text){var p=S.data.settings.profile||{},nm=p.name||S.data.ws.name||"",ini=nm.split(/\s+/).map(function(w){return w[0]||""}).join("").slice(0,2).toUpperCase();
